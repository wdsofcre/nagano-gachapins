<!doctype html>
<html lang="ja">
<head>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>

    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit}.app{max-width:980px;margin:auto;padding:env(safe-area-inset-top) 14px calc(80px + env(safe-area-inset-bottom))}
    header{padding:20px 2px 14px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.08em}.title{font-size:25px;font-weight:750;margin:4px 0}.subtitle{color:var(--muted);font-size:14px}
    .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px}.metric{padding:14px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:23px;margin-top:4px}
    .progress{height:10px;background:#edf0f5;border-radius:999px;overflow:hidden;margin-top:10px}.progress>div{height:100%;background:var(--accent);width:0;transition:.25s}
    .tabs{position:sticky;top:0;z-index:1000;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);display:flex;gap:8px;padding:10px 0}.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;flex:1}.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .view{display:none}.view.active{display:block}.panel{padding:14px;margin-top:10px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px}.search,.filter{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;min-width:0}.filter{max-width:145px}
    #map{position:relative;min-height:520px;border-radius:16px;overflow:hidden;background:#edf4ed;display:flex;justify-content:center;align-items:center;padding:12px}.offline-map{position:relative;width:min(100%,420px);aspect-ratio:393/608;max-width:100%}.map-svg{display:block;width:100%;height:100%;overflow:visible}.map-base{filter:saturate(.5)}.svg-pin{cursor:pointer;outline:none}.svg-pin .pin-shape{fill:var(--accent);stroke:#fff;stroke-width:2.2;vector-effect:non-scaling-stroke;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}.svg-pin.done .pin-shape{fill:var(--done)}.svg-pin.selected .pin-shape{stroke:#93c5fd;stroke-width:5}.svg-pin .pin-check{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle;pointer-events:none}.svg-pin:focus-visible .pin-shape{stroke:#111827;stroke-width:4}.map-popup{position:absolute;z-index:20;display:none;width:max-content;max-width:min(240px,72%);border:1px solid var(--line);border-radius:12px;padding:10px 36px 10px 11px;background:#fff;box-shadow:0 5px 18px #0003;text-align:left;--arrow-left:50%}.map-popup.show{display:block}.map-popup::after{content:"";position:absolute;left:var(--arrow-left);width:11px;height:11px;background:#fff;border:solid var(--line);transform:translateX(-50%) rotate(45deg)}.map-popup.above::after{bottom:-6px;border-width:0 1px 1px 0}.map-popup.below::after{top:-6px;border-width:1px 0 0 1px}.map-popup strong{display:block;font-size:15px;line-height:1.3}.map-popup-close{position:absolute;right:5px;top:5px;border:0;background:transparent;border-radius:7px;padding:4px 7px;color:var(--muted)}
    .station-list{display:grid;gap:8px;margin-top:10px}.station-card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.station-card.done{border-color:#bbf7d0;background:#f0fdf4}.station{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:12px}.check{width:25px;height:25px;accent-color:var(--done)}.station-name{font-weight:650}.details-toggle,.map-btn{border:0;border-radius:10px;padding:8px 10px;background:var(--accent2);color:#1d4ed8}.details-toggle{min-width:40px}.station-details{display:none;border-top:1px solid var(--line);padding:12px;background:#fff}.station-card.open .station-details{display:block}.detail-grid{display:grid;gap:12px}.detail-label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.memo{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--text)}.photo-box{display:grid;gap:8px}.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo-slot{display:grid;gap:7px}.photo-thumb-wrap{appearance:none;width:100%;padding:0;aspect-ratio:4/3;border:1px dashed var(--line);border-radius:12px;background:#f3f4f6;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;color:inherit}.photo-preview{display:none;width:100%;height:100%;object-fit:cover}.photo-preview.show{display:block}.photo-empty{font-size:12px;color:var(--muted)}.photo-slot.has-photo .photo-empty{display:none}.detail-actions{display:flex;gap:8px;flex-wrap:wrap}.photo-btn,.photo-delete,.photo-rotate,.google-btn{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--text);text-decoration:none;font-size:13px}.google-btn{background:var(--accent);border-color:var(--accent);color:#fff}.photo-delete{color:var(--danger)}.photo-rotate{color:#1d4ed8}.photo-input{display:none}.photo-modal{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.55)}.photo-modal.show{display:flex}.photo-modal-card{position:relative;width:min(92vw,480px);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:14px;box-shadow:0 18px 55px rgba(0,0,0,.35)}.photo-modal-close{position:absolute;right:8px;top:8px;z-index:2;border:0;background:rgba(255,255,255,.92);border-radius:999px;width:34px;height:34px;font-size:22px;line-height:1;color:var(--muted)}.photo-modal-title{font-weight:700;padding:3px 42px 10px 2px}.photo-modal-image-wrap{aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#f3f4f6;display:flex;align-items:center;justify-content:center}.photo-modal-image{display:none;width:100%;height:100%;object-fit:contain;background:#111}.photo-modal-image.show{display:block}.photo-modal-empty{color:var(--muted);font-size:14px}.photo-modal.has-photo .photo-modal-empty{display:none}.photo-modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.photo-modal-actions .photo-btn{grid-column:1/-1;text-align:center;background:var(--accent);border-color:var(--accent);color:#fff}.photo-modal-actions .photo-delete{grid-column:1/-1}.photo-modal:not(.has-photo) .photo-rotate,.photo-modal:not(.has-photo) .photo-delete{display:none}.save-status{font-size:12px;color:var(--muted);min-height:1em}.empty{text-align:center;color:var(--muted);padding:30px}
        .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.secondary,.danger{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}.danger{color:var(--danger)}
    footer{font-size:11px;color:var(--muted);line-height:1.5;padding:20px 2px}a{color:var(--accent)}
    @media(max-width:540px){.app{padding-left:10px;padding-right:10px}.title{font-size:22px}.metric{padding:11px}.metric strong{font-size:20px}.toolbar{grid-template-columns:1fr}.filter{max-width:none}.station{grid-template-columns:auto 1fr auto}.details-toggle{display:none}.map-btn{padding:8px 9px}.station-name{cursor:pointer}.detail-actions{display:grid}.detail-actions>*{text-align:center}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="eyebrow">道の駅 COLLECTION</div>
    <div class="title">長野版 ガチャピンズラリー</div>
  </header>

  <section class="metrics">
    <div class="metric"><span>取得数</span><strong id="count">0 / 46</strong></div>
    <div class="metric"><span>収集率</span><strong id="percent">0%</strong></div>
    <div class="metric"><span>未取得</span><strong id="remaining">46</strong></div>
  </section>
  <div class="progress"><div id="bar"></div></div>

  <nav class="tabs" aria-label="表示切替">
    <button class="tab active" data-view="mapView">マップ</button>
    <button class="tab" data-view="listView">一覧</button>
  </nav>

  <section id="mapView" class="view active">
    <div class="panel">
      <div id="map">
        <div class="offline-map" id="offlineMap">
          <svg id="mapSvg" class="map-svg" viewBox="0 0 393 608" role="img" aria-label="長野県の簡易地図と道の駅の位置" preserveAspectRatio="xMidYMid meet">
            <image class="map-base" href="nagano-map.svg" x="0" y="0" width="393" height="608" preserveAspectRatio="none"></image>
            <g id="pinLayer" aria-label="道の駅の位置"></g>
          </svg>
          <div id="mapPopup" class="map-popup" aria-live="polite">
            <button id="popupClose" class="map-popup-close" type="button" aria-label="閉じる">×</button>
            <strong id="popupName"></strong>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="listView" class="view">
    <div class="panel">
      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="道の駅名を検索">
        <select id="filter" class="filter" aria-label="表示条件">
          <option value="all">すべて</option>
          <option value="todo">未取得のみ</option>
          <option value="done">取得済みのみ</option>
        </select>
      </div>
      <div id="stationList" class="station-list"></div>
      <div class="actions">
        <button id="exportBtn" class="secondary">バックアップを書き出す</button>
        <button id="resetBtn" class="danger">チェックを全てリセット</button>
      </div>
    </div>
  </section>

</div>

<script>
const stations = [

  {id:6,region:'kanto',number:8,name:"白馬",x:35.1780,y:21.1832},
  {id:7,region:'kanto',number:9,name:"ふるさと豊田",x:65.1546,y:17.5573},

  {id:21,region:'kanto',number:27,name:"美ヶ原高原",x:50.0422,y:49.0458},
  {id:22,region:'kanto',number:28,name:"今井 恵みの里",x:44.8986,y:53.8168},
  {id:23,region:'kanto',number:29,name:"FARMUS木島平",x:71.2121,y:19.6565},
  {id:24,region:'kanto',number:30,name:"ヘルシーテラス佐久南",x:71.8178,y:55.1527},
  {id:25,region:'kanto',number:31,name:"女神の里 たてしな",x:69.5122,y:49.2366},

  {id:27,region:'kanto',number:33,name:"野沢温泉",x:69.8869,y:11.2595},
  {id:28,region:'kanto',number:35,name:"和田宿ステーション",x:56.4538,y:53.0534},
  {id:29,region:'kanto',number:36,name:"八千穂高原",x:62.1951,y:55.1527},
  {id:30,region:'chubu',number:1,name:"日義木曽駒高原",x:39.4146,y:68.5115},
  {id:31,region:'chubu',number:2,name:"大桑",x:33.2165,y:80.1527},
  {id:32,region:'chubu',number:3,name:"奈良井木曽の大橋",x:37.8201,y:60.1145},
  {id:33,region:'chubu',number:4,name:"信州平谷",x:31.8598,y:91.9847},
  {id:34,region:'chubu',number:5,name:"信濃路下條",x:38.8720,y:88.9313},
  {id:35,region:'chubu',number:6,name:"南アルプスむら長谷",x:51.4031,y:69.4656},
  {id:36,region:'chubu',number:7,name:"木曽ならかわ",x:46.4939,y:60.3053},
  {id:37,region:'chubu',number:8,name:"三岳",x:28.2879,y:70.6107},
  {id:38,region:'chubu',number:9,name:"信州新野千石平",x:40.5640,y:97.9008},
  {id:39,region:'chubu',number:11,name:"遠山郷",x:45.3252,y:91.7939},
  {id:40,region:'chubu',number:12,name:"木曽福島",x:32.8105,y:73.2824},
  {id:41,region:'chubu',number:13,name:"木曽川源流の里 きそむら",x:32.7744,y:64.8855},
  {id:42,region:'chubu',number:14,name:"田切の里",x:48.2190,y:75.7634},
  {id:43,region:'chubu',number:15,name:"南信州とよおかマルシェ",x:43.8486,y:79.1985},
  {id:44,region:'chubu',number:16,name:"大芝高原",x:43.2957,y:64.6947},
  {id:45,region:'chubu',number:17,name:"南信州うるぎ",x:35.0183,y:95.0382},
  {id:46,region:'chubu',number:18,name:"歌舞伎の里大鹿",x:51.8021,y:78.2443}
];

const KEY='nagano-gachapins-v1';
let checked=JSON.parse(localStorage.getItem(KEY)||'{}');
const MEMO_KEY='nagano-gachapins-memos-v1';
let memos=JSON.parse(localStorage.getItem(MEMO_KEY)||'{}');
let selectedStationId=null;
let openStationId=null;

const count=document.getElementById('count');
const percent=document.getElementById('percent');
const remaining=document.getElementById('remaining');
const bar=document.getElementById('bar');
const search=document.getElementById('search');
const filter=document.getElementById('filter');
const stationList=document.getElementById('stationList');
const offlineMap=document.getElementById('offlineMap');
const pinLayer=document.getElementById('pinLayer');
const mapSvg=document.getElementById('mapSvg');
const mapPopup=document.getElementById('mapPopup');
const popupName=document.getElementById('popupName');
const popupClose=document.getElementById('popupClose');
const resetBtn=document.getElementById('resetBtn');
const exportBtn=document.getElementById('exportBtn');
const photoModal=document.getElementById('photoModal');
const photoModalClose=document.getElementById('photoModalClose');
const photoModalTitle=document.getElementById('photoModalTitle');
const photoModalImage=document.getElementById('photoModalImage');
const photoModalInput=document.getElementById('photoModalInput');
const photoRotateLeft=document.getElementById('photoRotateLeft');
const photoRotateRight=document.getElementById('photoRotateRight');
const photoModalDelete=document.getElementById('photoModalDelete');
let activePhotoStation=null;
let activePhotoSlot=null;
let activePhotoObjectUrl=null;

function save(){localStorage.setItem(KEY,JSON.stringify(checked));}
function saveMemos(){localStorage.setItem(MEMO_KEY,JSON.stringify(memos));}
function updateStats(){const n=stations.filter(s=>checked[s.id]).length,p=Math.round(n/stations.length*100);count.textContent=`${n} / ${stations.length}`;percent.textContent=`${p}%`;remaining.textContent=stations.length-n;bar.style.width=`${p}%`;}
function renderList(){
  const q=search.value.trim().toLowerCase(),f=filter.value;
  const list=stations.filter(s=>{if(q&&!s.name.toLowerCase().includes(q))return false;if(f==='todo'&&checked[s.id])return false;if(f==='done'&&!checked[s.id])return false;return true;});
  stationList.innerHTML='';
  if(!list.length){stationList.innerHTML='<div class="empty">該当する道の駅はありません</div>';return;}
  list.forEach(s=>{
    const card=document.createElement('div');
    card.className='station-card'+(checked[s.id]?' done':'')+(openStationId===s.id?' open':'');

    const row=document.createElement('div');
    row.className='station';

    const cb=document.createElement('input');
    cb.type='checkbox';
    cb.className='check';
    cb.checked=!!checked[s.id];
    cb.setAttribute('aria-label',s.name+'を取得済みにする');
    cb.addEventListener('change',e=>{e.stopPropagation();checked[s.id]=cb.checked;save();updateStats();renderList();renderPins();});

    const text=document.createElement('div');
    text.className='station-name';
    text.textContent=s.name;
    text.setAttribute('role','button');
    text.setAttribute('tabindex','0');
    const toggleDetails=()=>{openStationId=openStationId===s.id?null:s.id;renderList();};
    text.addEventListener('click',toggleDetails);
    text.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleDetails();}});

    const detailBtn=document.createElement('button');
    detailBtn.type='button';
    detailBtn.className='details-toggle';
    detailBtn.textContent=openStationId===s.id?'▲':'▼';
    detailBtn.setAttribute('aria-label',s.name+'の詳細を'+(openStationId===s.id?'閉じる':'開く'));
    detailBtn.addEventListener('click',toggleDetails);

    const mapBtn=document.createElement('button');
    mapBtn.type='button';
    mapBtn.className='map-btn';
    mapBtn.textContent='地図';
    mapBtn.addEventListener('click',()=>showStation(s));

    row.append(cb,text,detailBtn,mapBtn);

    const details=document.createElement('div');
    details.className='station-details';
    details.innerHTML=`
      <div class="detail-grid">
        <div class="photo-box">
          <span class="detail-label">写真（2枚まで）</span>
          <div class="photo-grid">
            ${[1,2].map(slot=>`
              <div class="photo-slot" data-photo-slot="${slot}">
                <button class="photo-thumb-wrap" type="button" aria-label="写真${slot}を開く">
                  <span class="photo-empty">写真${slot}</span>
                  <img class="photo-preview" alt="${s.name}の登録写真${slot}">
                </button>
              </div>`).join('')}
          </div>
        </div>
        <label>
          <span class="detail-label">メモ</span>
          <textarea class="memo" placeholder="メモを入力"></textarea>
          <span class="save-status"></span>
        </label>
        <div class="detail-actions">
          <a class="google-btn" target="_blank" rel="noopener noreferrer">Googleマップで開く</a>
        </div>
      </div>`;

    const memo=details.querySelector('.memo');
    const saveStatus=details.querySelector('.save-status');
    memo.value=memos[s.id]||'';
    let memoTimer;
    memo.addEventListener('input',()=>{
      memos[s.id]=memo.value;
      saveMemos();
      saveStatus.textContent='保存しました';
      clearTimeout(memoTimer);
      memoTimer=setTimeout(()=>saveStatus.textContent='',1200);
    });

    const google=details.querySelector('.google-btn');
    google.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('道の駅 '+s.name+' 長野県');

    details.querySelectorAll('.photo-slot').forEach(slotEl=>{
      const slot=Number(slotEl.dataset.photoSlot);
      const preview=slotEl.querySelector('.photo-preview');
      const thumb=slotEl.querySelector('.photo-thumb-wrap');

      const setPhotoUI=blob=>{
        if(preview.dataset.objectUrl)URL.revokeObjectURL(preview.dataset.objectUrl);
        if(blob){
          const url=URL.createObjectURL(blob);
          preview.src=url;
          preview.dataset.objectUrl=url;
          preview.classList.add('show');
          slotEl.classList.add('has-photo');
        }else{
          preview.removeAttribute('src');
          delete preview.dataset.objectUrl;
          preview.classList.remove('show');
          slotEl.classList.remove('has-photo');
        }
      };

      loadPhoto(s.id,slot).then(setPhotoUI).catch(()=>setPhotoUI(null));
      thumb.addEventListener('click',()=>openPhotoModal(s,slot));
    });

    card.append(row,details);
    stationList.appendChild(card);
  });
}



function setModalPhoto(blob){
  if(activePhotoObjectUrl){URL.revokeObjectURL(activePhotoObjectUrl);activePhotoObjectUrl=null;}
  if(blob){
    activePhotoObjectUrl=URL.createObjectURL(blob);
    photoModalImage.src=activePhotoObjectUrl;
    photoModalImage.classList.add('show');
    photoModal.classList.add('has-photo');
  }else{
    photoModalImage.removeAttribute('src');
    photoModalImage.classList.remove('show');
    photoModal.classList.remove('has-photo');
  }
}
async function openPhotoModal(station,slot){
  activePhotoStation=station;
  activePhotoSlot=slot;
  photoModalTitle.textContent=`${station.name}・写真${slot}`;
  photoModal.classList.add('show');
  photoModal.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  try{setModalPhoto(await loadPhoto(station.id,slot));}catch{setModalPhoto(null);}
}
function closePhotoModal(){
  photoModal.classList.remove('show','has-photo');
  photoModal.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  setModalPhoto(null);
  activePhotoStation=null;
  activePhotoSlot=null;
  photoModalInput.value='';
}
async function refreshPhotoModal(){
  if(!activePhotoStation||!activePhotoSlot)return;
  setModalPhoto(await loadPhoto(activePhotoStation.id,activePhotoSlot));
  renderList();
}
photoModalClose.addEventListener('click',closePhotoModal);
photoModal.addEventListener('click',e=>{if(e.target===photoModal)closePhotoModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&photoModal.classList.contains('show'))closePhotoModal();});
photoModalInput.addEventListener('change',async()=>{
  const file=photoModalInput.files&&photoModalInput.files[0];
  if(!file||!activePhotoStation)return;
  try{
    const blob=await resizeImage(file,1200,0.68);
    await savePhoto(activePhotoStation.id,activePhotoSlot,blob);
    await refreshPhotoModal();
  }catch(err){alert('写真を保存できませんでした。');}
  photoModalInput.value='';
});
async function rotateActivePhoto(direction){
  if(!activePhotoStation)return;
  try{
    const blob=await loadPhoto(activePhotoStation.id,activePhotoSlot);
    if(!blob)return;
    const rotated=await rotateImage(blob,direction);
    await savePhoto(activePhotoStation.id,activePhotoSlot,rotated);
    await refreshPhotoModal();
  }catch(err){alert('写真を回転できませんでした。');}
}
photoRotateLeft.addEventListener('click',()=>rotateActivePhoto(-90));
photoRotateRight.addEventListener('click',()=>rotateActivePhoto(90));
photoModalDelete.addEventListener('click',async()=>{
  if(!activePhotoStation)return;
  if(!confirm('この写真を削除しますか？'))return;
  try{
    await deletePhoto(activePhotoStation.id,activePhotoSlot);
    await refreshPhotoModal();
  }catch(err){alert('写真を削除できませんでした。');}
});

const PHOTO_DB='nagano-gachapins-photos-v1';
function openPhotoDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(PHOTO_DB,1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('photos'))req.result.createObjectStore('photos');};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function photoKey(id,slot){return `${id}:${slot}`;}
async function savePhoto(id,slot,blob){
  const db=await openPhotoDB();
  await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,photoKey(id,slot));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
  db.close();
}
async function loadPhoto(id,slot){
  const db=await openPhotoDB();
  const storeKey=photoKey(id,slot);
  const value=await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly');const store=tx.objectStore('photos');const req=store.get(storeKey);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});
  if(value){db.close();return value;}
  if(slot===1){
    const legacy=await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly');const req=tx.objectStore('photos').get(String(id));req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});
    if(legacy){
      await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');const store=tx.objectStore('photos');store.put(legacy,storeKey);store.delete(String(id));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
      db.close();
      return legacy;
    }
  }
  db.close();
  return null;
}
async function deletePhoto(id,slot){
  const db=await openPhotoDB();
  await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(photoKey(id,slot));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
  db.close();
}
function resizeImage(file,maxSize=1200,quality=.68){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const scale=Math.min(1,maxSize/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.max(1,Math.round(img.naturalWidth*scale));
        const h=Math.max(1,Math.round(img.naturalHeight*scale));
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
        ctx.drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve(blob):reject(new Error('画像変換に失敗'));},'image/jpeg',quality);
      }catch(e){URL.revokeObjectURL(url);reject(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('画像を読み込めません'));};
    img.src=url;
  });
}
function rotateImage(blob,degrees){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(blob);
    img.onload=()=>{
      try{
        const quarter=Math.abs(degrees)%180===90;
        const canvas=document.createElement('canvas');
        canvas.width=quarter?img.naturalHeight:img.naturalWidth;
        canvas.height=quarter?img.naturalWidth:img.naturalHeight;
        const ctx=canvas.getContext('2d');
        ctx.translate(canvas.width/2,canvas.height/2);
        ctx.rotate(degrees*Math.PI/180);
        ctx.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);
        canvas.toBlob(out=>{URL.revokeObjectURL(url);out?resolve(out):reject(new Error('画像回転に失敗'));},'image/jpeg',0.68);
      }catch(e){URL.revokeObjectURL(url);reject(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('画像を読み込めません'));};
    img.src=url;
  });
}

function closeStationCard(){selectedStationId=null;mapPopup.classList.remove('show','above','below');renderPins();}
function positionPopup(stationId){
  const pin=pinLayer.querySelector(`[data-station-id="${stationId}"]`);
  if(!pin||!mapPopup.classList.contains('show'))return;
  const mapRect=offlineMap.getBoundingClientRect();
  const pinRect=pin.getBoundingClientRect();
  const popupRect=mapPopup.getBoundingClientRect();
  const gap=14;
  const padding=6;
  const centerX=pinRect.left-mapRect.left+pinRect.width/2;
  const pinCenterY=pinRect.top-mapRect.top+pinRect.height/2;
  const placeBelow=pinCenterY<mapRect.height/2;
  let left=centerX-popupRect.width/2;
  left=Math.max(padding,Math.min(mapRect.width-popupRect.width-padding,left));
  const top=placeBelow
    ? pinRect.bottom-mapRect.top+gap
    : pinRect.top-mapRect.top-popupRect.height-gap;
  mapPopup.style.left=left+'px';
  mapPopup.style.top=Math.max(padding,Math.min(mapRect.height-popupRect.height-padding,top))+'px';
  mapPopup.style.setProperty('--arrow-left',(centerX-left)+'px');
  mapPopup.classList.toggle('below',placeBelow);
  mapPopup.classList.toggle('above',!placeBelow);
}
function showStationCard(s){
  selectedStationId=s.id;
  popupName.textContent=s.name;
  mapPopup.classList.remove('above','below');
  mapPopup.classList.add('show');
  renderPins();
  requestAnimationFrame(()=>positionPopup(s.id));
}
function renderPins(){
  pinLayer.innerHTML='';
  const NS='http://www.w3.org/2000/svg';
  stations.forEach(s=>{
    const x=s.x/100*393;
    const y=s.y/100*608;
    const pin=document.createElementNS(NS,'g');
    pin.classList.add('svg-pin');
    if(checked[s.id])pin.classList.add('done');
    if(selectedStationId===s.id)pin.classList.add('selected');
    pin.dataset.stationId=s.id;
    pin.setAttribute('transform',`translate(${x} ${y}) scale(.82)`);
    pin.setAttribute('role','button');
    pin.setAttribute('tabindex','0');
    pin.setAttribute('aria-label',s.name);

    const shape=document.createElementNS(NS,'path');
    shape.setAttribute('class','pin-shape');
    shape.setAttribute('d','M0 0 L-10 -10 Q-14 -14 -14 -20 A14 14 0 1 1 14 -20 Q14 -14 10 -10 Z');
    pin.appendChild(shape);

    if(checked[s.id]){
      const check=document.createElementNS(NS,'text');
      check.setAttribute('class','pin-check');
      check.setAttribute('x','0');
      check.setAttribute('y','-20');
      check.textContent='✓';
      pin.appendChild(check);
    }

    const open=e=>{e.preventDefault();e.stopPropagation();showStationCard(s);};
    pin.addEventListener('click',open);
    pin.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ' )open(e);});
    pinLayer.appendChild(pin);
  });
}
function showStation(s){document.querySelector('[data-view="mapView"]').click();showStationCard(s);setTimeout(()=>offlineMap.scrollIntoView({behavior:'smooth',block:'nearest'}),50);}


document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  closeStationCard();
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById(t.dataset.view).classList.add('active');
  renderPins();
}));
window.addEventListener('resize',()=>{if(selectedStationId)requestAnimationFrame(()=>positionPopup(selectedStationId));});offlineMap.addEventListener('click',closeStationCard);mapPopup.addEventListener('click',e=>e.stopPropagation());popupClose.addEventListener('click',closeStationCard);search.addEventListener('input',renderList);filter.addEventListener('change',renderList);
resetBtn.addEventListener('click',()=>{if(confirm('取得済みチェックをすべて消しますか？')){checked={};save();updateStats();renderList();renderPins();}});
exportBtn.addEventListener('click',()=>{const data={exportedAt:new Date().toISOString(),checked,memos};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nagano-gachapins-backup.json';a.click();URL.revokeObjectURL(a.href);});
updateStats();renderList();renderPins();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
